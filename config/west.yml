manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson/
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: beekeeb
      url-base: https://github.com/beekeeb
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Toucan2 trackpad: Azoteq TPS43 (IQS5xx) over I2C. Replaces the Cirque
    # Pinnacle SPI driver (geeksville/cirque-input-module @ toucan) that drove
    # the Toucan1 pad. Pinned to an explicit SHA rather than beekeeb's `main`
    # so builds stay reproducible -- an upstream push must not silently change
    # our firmware. Bump deliberately after reading the diff.
    - name: zmk_driver_azoteq
      remote: beekeeb
      revision: 52fcfe5026c9f74d611d05b2084548e046a7e274
    # Pinch-to-zoom: maps the pad's INPUT_REL_MISC 'zoom wheel' onto key
    # presses (see zip_zoom_mapper in toucan.dtsi). Also SHA-pinned.
    - name: zmk-input-zoom
      remote: beekeeb
      revision: 91bbe0c0e02145da50c9df798489479d28be1804
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
  self:
    path: config
