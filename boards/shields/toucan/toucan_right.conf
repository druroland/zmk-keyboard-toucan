CONFIG_ZMK_POINTING=y

# The trackpad driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

# Toucan2 trackpad: Azoteq TPS43 (IQS5xx) on I2C, replacing the Cirque Pinnacle
# that sat on SPI. This half is the only one that talks to the pad.
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

# The Azoteq driver does its register reads and gesture decoding on the shared
# Zephyr input thread; the 512-byte default overflows it.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Match the left half (revisited 0 -> 5 for idle power). The trackpad lives on
# this peripheral half, so this is the latency most likely to affect pointer
# re-touch after a short pause (~44ms worst case). See toucan_left.conf for the
# full rationale; drop back toward 0 if the pointer feels sticky.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=5

# Boost BLE TX power to +8 dBm on this half too -- strengthens BOTH the split link
# (right -> central, carries the trackpad) and helps overall RF robustness.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Match the left half / PocketCorne: request improved connection parameters for
# a more stable, responsive BLE link. See toucan_left.conf for rationale.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# (The old CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER knob is gone with the Cirque.
# The Azoteq equivalent is the `idle-sleep` devicetree property on the trackpad
# node -- also left off, for the same ~300ms-wake reason. See toucan_right.overlay.)

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Deep sleep (radio off, MCU System-OFF) drops draw from ~1.7mA idle to ~tens of
# uA -- ~20x lower, the biggest battery lever. Trade-off: BLE disconnects, so
# waking costs a ~1-2s reconnect. 60min -> 20min: sleeps after typical away gaps
# (lunch, meetings) instead of burning idle power for up to an hour. On the
# 180mAh cells this is the difference between days and weeks of standby.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# 'Regular' ZMK idle behavior (default 30000). At this timeout the pad is
# PM-shut-down (1.7mA idle vs 2.9mA active), so this is the main lever for the
# right half's higher power draw -- shorter timeout = pad sleeps sooner. Dropped
# 30s -> 10s now that waking is smooth (host-side BLE conn-interval fix removed
# the post-wake buffering; only the ~300ms wake remains, suppressed if a key was
# pressed within the timeout). Tune this single number for power vs how often you
# hit the wake: 5000 = aggressive, 15000 = gentler.
CONFIG_ZMK_IDLE_TIMEOUT=10000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the trackpad driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y
